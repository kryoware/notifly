<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifly — MD3 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- stage chrome (adapts to viewer light/dark) ---------- */
:root{
  --stage-bg:#eceef0; --stage-fg:#1b1d1f; --stage-dim:#5c6166; --stage-line:#d3d7db; --stage-card:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage-bg:#141617; --stage-fg:#e6e9ea; --stage-dim:#9aa1a6; --stage-line:#2c3033; --stage-card:#1d2022;
  }
}
:root[data-theme="dark"]{
  --stage-bg:#141617; --stage-fg:#e6e9ea; --stage-dim:#9aa1a6; --stage-line:#2c3033; --stage-card:#1d2022;
}

/* ---------- MD3 palettes ---------- */
.phone[data-palette="evergreen"]{
  --primary:#22684B; --on-primary:#FFFFFF; --primary-container:#A8F2C8; --on-primary-container:#00210F;
  --secondary:#4E6355; --on-secondary:#FFFFFF; --secondary-container:#D0E8D6; --on-secondary-container:#0B1F14;
  --tertiary:#3B6470; --on-tertiary:#FFFFFF; --tertiary-container:#BFEAF8; --on-tertiary-container:#001F27;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --income:#1E6B45; --income-container:#A4F2C4; --on-income-container:#002110;
  --expense:#BA1A1A; --expense-container:#FFDAD6; --on-expense-container:#410002;
  --surface:#F6FBF5; --on-surface:#181D19; --surface-variant:#DCE5DC; --on-surface-variant:#414942;
  --surf-lowest:#FFFFFF; --surf-low:#F0F5EF; --surf:#EBF0E9; --surf-high:#E5EAE4; --surf-highest:#DFE4DE;
  --outline:#717972; --outline-variant:#C0C9C0; --inverse-surface:#2D322D; --inverse-on-surface:#EEF2EC;
}
.phone[data-palette="indigo"]{
  --primary:#6750A4; --on-primary:#FFFFFF; --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary:#625B71; --on-secondary:#FFFFFF; --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary:#7D5260; --on-tertiary:#FFFFFF; --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
  --error:#B3261E; --on-error:#FFFFFF; --error-container:#F9DEDC; --on-error-container:#410E0B;
  --income:#2E6B4F; --income-container:#B7EFD0; --on-income-container:#00210F;
  --expense:#B3261E; --expense-container:#F9DEDC; --on-expense-container:#410E0B;
  --surface:#FEF7FF; --on-surface:#1D1B20; --surface-variant:#E7E0EC; --on-surface-variant:#49454F;
  --surf-lowest:#FFFFFF; --surf-low:#F7F2FA; --surf:#F3EDF7; --surf-high:#ECE6F0; --surf-highest:#E6E0E9;
  --outline:#79747E; --outline-variant:#CAC4D0; --inverse-surface:#322F35; --inverse-on-surface:#F5EFF7;
}
.phone[data-palette="slate"]{
  --primary:#35566E; --on-primary:#FFFFFF; --primary-container:#CDE5FF; --on-primary-container:#001D32;
  --secondary:#51606F; --on-secondary:#FFFFFF; --secondary-container:#D4E4F6; --on-secondary-container:#0D1D2A;
  --tertiary:#67587A; --on-tertiary:#FFFFFF; --tertiary-container:#EDDCFF; --on-tertiary-container:#221533;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --income:#2A6A47; --income-container:#ACF2C8; --on-income-container:#002110;
  --expense:#BA1A1A; --expense-container:#FFDAD6; --on-expense-container:#410002;
  --surface:#F8F9FC; --on-surface:#191C1E; --surface-variant:#DEE3EB; --on-surface-variant:#42474E;
  --surf-lowest:#FFFFFF; --surf-low:#F2F4F8; --surf:#ECEEF2; --surf-high:#E6E9ED; --surf-highest:#E0E3E8;
  --outline:#72777F; --outline-variant:#C2C7CF; --inverse-surface:#2E3133; --inverse-on-surface:#EFF1F4;
}
.phone[data-palette="clay"]{
  --primary:#8F4C38; --on-primary:#FFFFFF; --primary-container:#FFDBD1; --on-primary-container:#3A0B01;
  --secondary:#77574E; --on-secondary:#FFFFFF; --secondary-container:#FFDBD1; --on-secondary-container:#2C150F;
  --tertiary:#6C5D2F; --on-tertiary:#FFFFFF; --tertiary-container:#F5E1A7; --on-tertiary-container:#231B00;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --income:#3C6B45; --income-container:#BEF0C4; --on-income-container:#00210B;
  --expense:#BA1A1A; --expense-container:#FFDAD6; --on-expense-container:#410002;
  --surface:#FFF8F6; --on-surface:#231917; --surface-variant:#F5DED8; --on-surface-variant:#53433F;
  --surf-lowest:#FFFFFF; --surf-low:#FFF1ED; --surf:#FFE9E4; --surf-high:#FFE2DB; --surf-highest:#F8D9D2;
  --outline:#85736E; --outline-variant:#D8C2BC; --inverse-surface:#392E2B; --inverse-on-surface:#FFEDE8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stage-bg); color:var(--stage-fg);
  font-family:Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; gap:20px;
  padding:28px 16px 48px; min-height:100vh;
}

/* ---------- stage controls ---------- */
.controls{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brandline{display:flex;flex-direction:column;gap:2px}
.brandline b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.brandline span{font-size:12.5px;color:var(--stage-dim)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:7px;border:1px solid var(--stage-line);background:var(--stage-card);
  border-radius:999px;padding:6px 13px 6px 7px;cursor:pointer;font:500 12.5px Roboto,sans-serif;color:var(--stage-fg)}
.sw:focus-visible{outline:2px solid var(--stage-fg);outline-offset:2px}
.sw i{width:17px;height:17px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.14)}
.sw[aria-pressed="true"]{border-color:var(--stage-fg);box-shadow:inset 0 0 0 1px var(--stage-fg)}

/* ---------- device ---------- */
.phone{
  width:360px;max-width:100%;height:800px;background:var(--surface);color:var(--on-surface);
  border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 22px 50px rgba(0,0,0,.20),0 0 0 9px #101314,0 0 0 10px #303537;
}
@media (max-width:520px){
  .phone{height:78vh;min-height:600px;border-radius:26px;box-shadow:0 10px 26px rgba(0,0,0,.18),0 0 0 5px #101314}
}
#app{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- MD3 type ---------- */
.t-headline{font:400 28px/36px Roboto;letter-spacing:0;margin:0}
.t-headline-s{font:400 24px/32px Roboto;margin:0}
.t-title-l{font:400 22px/28px Roboto;margin:0}
.t-title-m{font:500 16px/24px Roboto;letter-spacing:.15px;margin:0}
.t-body-l{font:400 16px/24px Roboto;letter-spacing:.5px;margin:0}
.t-body-m{font:400 14px/20px Roboto;letter-spacing:.25px;margin:0}
.t-body-s{font:400 12px/16px Roboto;letter-spacing:.4px;margin:0}
.t-label-l{font:500 14px/20px Roboto;letter-spacing:.1px;margin:0}
.t-label-m{font:500 12px/16px Roboto;letter-spacing:.5px;margin:0}
.t-label-s{font:500 11px/16px Roboto;letter-spacing:.5px;margin:0}
.dim{color:var(--on-surface-variant)}

/* ---------- structure ---------- */
.statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:0 0 auto;
  font:500 12px/16px Roboto;letter-spacing:.5px}
.statusbar span:last-child{color:var(--on-surface-variant);letter-spacing:1px}
.appbar{height:64px;display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;flex:0 0 auto;background:var(--surface)}
.appbar.back{padding-left:4px}
.appbar .ttl{flex:1;font:400 22px/28px Roboto}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.pad{padding:0 24px}
.stack{display:flex;flex-direction:column}
.grow{flex:1}
.row{display:flex;align-items:center}

/* ---------- controls ---------- */
.iconbtn{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;border-radius:50%;
  cursor:pointer;color:var(--on-surface-variant);flex:0 0 auto}
.iconbtn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.iconbtn:focus-visible{outline:2px solid var(--primary);outline-offset:-3px}
.btn{height:40px;border-radius:20px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 24px;font:500 14px/20px Roboto;letter-spacing:.1px;cursor:pointer;width:100%}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn.text{background:transparent;color:var(--primary)}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn[disabled]{background:var(--surf-highest);color:var(--on-surface-variant);opacity:.6;cursor:not-allowed}
.btn.auto{width:auto}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field .box{min-height:56px;border:1px solid var(--outline);border-radius:8px;background:var(--surface);
  padding:7px 16px;display:flex;flex-direction:column;justify-content:center;transition:border-color .12s}
.field .box:focus-within{border-color:var(--primary);border-width:2px;padding:6px 15px}
.field label{font:400 12px/16px Roboto;letter-spacing:.4px;color:var(--on-surface-variant)}
.field .box:focus-within label{color:var(--primary)}
.field input,.field select,.field textarea{border:0;background:none;outline:0;padding:0;color:var(--on-surface);
  font:400 16px/24px Roboto;letter-spacing:.5px;width:100%;font-family:Roboto,sans-serif}
.field .help{font:400 12px/16px Roboto;padding-left:16px;color:var(--on-surface-variant)}
.field.err .box{border-color:var(--error);border-width:2px;padding:6px 15px}
.field.err .help,.field.err label{color:var(--error)}

.sw-track{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surf-highest);
  display:flex;align-items:center;padding:0 4px;cursor:pointer;flex:0 0 auto;transition:background .15s,border-color .15s}
.sw-track .knob{width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .15s}
.sw-track[aria-checked="true"]{background:var(--primary);border-color:var(--primary);justify-content:flex-end;padding:0 4px 0 0}
.sw-track[aria-checked="true"] .knob{width:24px;height:24px;background:var(--on-primary)}
.sw-track:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.chips{display:flex;gap:8px;padding:4px 24px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;border-radius:8px;border:1px solid var(--outline-variant);background:transparent;
  color:var(--on-surface-variant);padding:0 16px;font:500 14px/20px Roboto;letter-spacing:.1px;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent;padding-left:8px}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- list rows ---------- */
.txn{display:flex;align-items:center;gap:16px;padding:12px 16px;width:100%;background:none;border:0;
  text-align:left;cursor:pointer;color:inherit;font-family:inherit}
.txn:hover{background:color-mix(in srgb,var(--on-surface) 5%,transparent)}
.txn:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.avatar.sq{border-radius:12px;background:var(--surf-highest)}
.txn .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txn .mid b{font:400 16px/24px Roboto;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.amt{font:500 16px/24px Roboto}
.badge{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:8px;
  padding:2px 8px;font:500 11px/16px Roboto;letter-spacing:.5px}
.sectionhdr{padding:16px 24px 6px;color:var(--on-surface-variant);font:500 12px/16px Roboto;letter-spacing:.5px}

.card{background:var(--surf-low);border-radius:20px;padding:20px;margin:0 24px}
.balance{background:var(--primary-container);color:var(--on-primary-container);border-radius:20px;padding:20px;margin:8px 24px 4px}
.balance .big{font:700 36px/44px Roboto;margin:2px 0 0}
.split{display:flex;gap:20px;padding-top:12px}
.split div{display:flex;align-items:center;gap:6px;font:500 14px/20px Roboto}

.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--tertiary-container);
  color:var(--on-tertiary-container);font:400 14px/20px Roboto;letter-spacing:.25px}

/* ---------- bottom nav + fab ---------- */
.nav{height:80px;background:var(--surf);display:flex;padding:12px 0 16px;flex:0 0 auto}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  color:var(--on-surface-variant);font-family:inherit}
.nav button:focus-visible{outline:2px solid var(--primary);outline-offset:-4px;border-radius:12px}
.nav .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.nav button[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
.nav button[aria-current="page"] .lbl{color:var(--on-surface)}
.nav .lbl{font:500 12px/16px Roboto;letter-spacing:.5px}
.fab{position:absolute;right:16px;bottom:96px;height:56px;min-width:56px;border-radius:16px;border:0;
  background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;
  padding:0 16px;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
  font:500 14px/20px Roboto;letter-spacing:.1px}
.fab:focus-visible{outline:2px solid var(--primary);outline-offset:3px}

/* ---------- overlays ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:24px;z-index:20}
.dialog{background:var(--surf-high);color:var(--on-surface);border-radius:28px;padding:24px;width:100%;max-width:312px}
.dialog h3{font:400 24px/32px Roboto;margin:0 0 16px}
.dialog p{font:400 14px/20px Roboto;letter-spacing:.25px;color:var(--on-surface-variant);margin:0 0 24px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px}
.snack{position:absolute;left:16px;right:16px;bottom:96px;background:var(--inverse-surface);color:var(--inverse-on-surface);
  border-radius:8px;padding:14px 16px;font:400 14px/20px Roboto;letter-spacing:.25px;z-index:30;
  box-shadow:0 4px 8px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px}
.snack b{color:var(--primary-container);font-weight:500;cursor:pointer;margin-left:auto}

.dots{display:flex;gap:8px;justify-content:center;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--outline-variant);display:block}
.dots i.on{width:24px;background:var(--primary)}

.steps{display:flex;flex-direction:column;gap:20px;padding-top:16px}
.step{display:flex;gap:16px}
.step .bdg{width:44px;height:44px;border-radius:14px;background:var(--secondary-container);color:var(--on-secondary-container);
  display:grid;place-items:center;flex:0 0 auto}
.hero{width:160px;height:160px;border-radius:48px;background:var(--primary-container);color:var(--on-primary-container);
  display:grid;place-items:center;margin:40px auto 44px}
.notifmock{background:var(--surf-high);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.notifmock .hd{display:flex;align-items:center;gap:8px}
.notifmock .hd i{width:20px;height:20px;border-radius:6px;background:var(--primary);display:block}
.resultcard{background:var(--surf-low);border-radius:16px;overflow:hidden}
.settingrow{display:flex;align-items:center;gap:16px;padding:14px 24px;width:100%;background:none;border:0;
  text-align:left;color:inherit;font-family:inherit;cursor:pointer}
.settingrow:hover{background:color-mix(in srgb,var(--on-surface) 5%,transparent)}
.settingrow:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.settingrow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.divider{height:1px;background:var(--outline-variant);margin:8px 24px}
.bars{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;font:400 14px/20px Roboto}
.bar-track{height:10px;border-radius:5px;background:var(--surf-highest);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--primary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:64px 32px;text-align:center}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;height:40px;border:0;background:none;cursor:pointer;color:var(--on-surface);
  font:500 14px/20px Roboto;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.tools{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tool{border:1px solid var(--stage-line);background:var(--stage-card);color:var(--stage-fg);border-radius:999px;
  padding:9px 16px;font:500 12.5px Roboto;cursor:pointer}
.tool:focus-visible{outline:2px solid var(--stage-fg);outline-offset:2px}
.hint{font:400 12px/17px Roboto;color:var(--stage-dim);text-align:center;max-width:560px}
/* ---------- background sync ring ---------- */
.acct{position:relative}
.acct .ring{position:absolute;left:4px;top:4px;width:40px;height:40px;transform:rotate(-90deg);
  opacity:0;transition:opacity .25s;pointer-events:none}
.acct.syncing .ring{opacity:1}
.acct .ring circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.acct .ring .bg{stroke:var(--surf-highest)}
.acct .ring .fg{stroke:var(--primary);transition:stroke .25s}
.acct.syncing{color:var(--primary)}
.acct.done .ring .fg{stroke:var(--income)}
.acct.done{color:var(--income)}
.acct.done .glyph{animation:pop .32s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.banner.done{background:var(--income-container);color:var(--on-income-container)}
.acct .pending{position:absolute;top:5px;right:5px;min-width:10px;height:16px;border-radius:9px;
  background:var(--tertiary);color:var(--on-tertiary);font:500 10px/16px Roboto;letter-spacing:0;
  padding:0 4px;border:2px solid var(--surface);text-align:center}
.banner.sync{background:var(--secondary-container);color:var(--on-secondary-container)}
.spin{display:grid;place-items:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- debug / notification log ---------- */
.logcard{margin:0 16px 8px;background:var(--surf-low);border-radius:16px;overflow:hidden}
.loghead{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;background:none;
  border:0;text-align:left;color:inherit;font-family:inherit;cursor:pointer}
.loghead:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.loghead .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.raw{font:400 12.5px/19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--on-surface);
  background:var(--surf-highest);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.raw mark{background:var(--primary-container);color:var(--on-primary-container);border-radius:3px;
  padding:0 3px;font-weight:600}
.raw mark.dir{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.tag{border-radius:8px;padding:2px 8px;font:500 11px/16px Roboto;letter-spacing:.5px;white-space:nowrap;flex:0 0 auto}
.tag.ok{background:var(--income-container);color:var(--on-income-container)}
.tag.rev{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.tag.bad{background:var(--error-container);color:var(--on-error-container)}
.tag.skip{background:var(--surf-highest);color:var(--on-surface-variant)}
.logdetail{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:16px;font:400 13px/19px Roboto}
.kv>span:first-child{color:var(--on-surface-variant)}

let S = seed();
const KEY = "notifly.v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ S = Object.assign(seed(), JSON.parse(r)); } }catch(e){}
  S.sync = { active:false, p:0, total:0, done:false };
}

const money = n => "₱" + Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = t => (t.type === "income" ? "+" : "−") + money(t.amount);
const totals = () => {
  let i = 0, e = 0;
  for (const t of S.txns){ if(t.type==="income") i += +t.amount; else e += +t.amount; }
  return { i, e, net: i - e };
};
const reviewCount = () => S.txns.filter(t => t.status === "review").length;
function toast(msg, action){ S.snack = { msg, action: action || null }; render();
  clearTimeout(toast._t); toast._t = setTimeout(() => { S.snack = null; render(); }, 3200); }
function go(s){ S.screen = s; S.dialog = null; render(); }
function touch(){ if(S.offline){ S.queued++; } }

/* ---- background sync ---- */
let syncTimer = null;
function paintRing(){
  document.querySelectorAll("[data-ring]").forEach(c => {
    c.style.strokeDashoffset = String(RING * (1 - S.sync.p));
  });
  document.querySelectorAll("[data-queued]").forEach(n => { n.textContent = S.queued; });
}
function startSync(){
  const total = S.queued;
  S.offline = false;
  S.sync = { active:true, p:0, total, done:false };
  render();
  const DUR = 3800, t0 = Date.now();
  clearInterval(syncTimer);
  syncTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / DUR);
    S.sync.p = p;
    S.queued = Math.ceil(total * (1 - p));
    paintRing();
    if(p >= 1){
      clearInterval(syncTimer);
      S.queued = 0;
      S.sync.done = true;
      render();
      toast(`Synced ${total} change${total === 1 ? "" : "s"}`);
      setTimeout(() => {
        S.sync = { active:false, p:0, total:0, done:false };
        render();
      }, 1400);
    }
  }, 50);
}
function setOffline(v){
  if(S.sync.active) return;
  if(v === S.offline) return;
  if(v){ S.offline = true; toast("Offline mode on — edits will queue"); render(); return; }
  if(S.queued > 0) startSync();
  else { S.offline = false; toast("Back online — nothing was pending"); render(); }
}

  if(S.sync.active) return `<div class="banner sync">${spinner}

const TAGS = { parsed:["ok","Parsed"], review:["rev","Needs review"], unrecognized:["bad","Not recognised"], ignored:["skip","Ignored"] };

function highlight(e){
  let out = esc(e.raw);
  if(e.amt) out = out.replace(esc(e.amt), `<mark>${esc(e.amt)}</mark>`);
  if(e.dir) out = out.replace(new RegExp("(^|\\\\s)(" + esc(e.dir) + ")"), `$1<mark class="dir">$2</mark>`);
  return out;
}

/* ============ render ============ */
function render(){
  document.getElementById("phone").dataset.palette = S.palette;
  const view = V[S.screen] || V.welcome;
  document.getElementById("app").innerHTML =
    view() +
    (S.dialog ? dialogs[S.dialog]() : "") +
    (S.snack ? `<div class="snack" role="status">${esc(S.snack.msg)}${S.snack.action?`<b data-action="snackaction">${esc(S.snack.action)}</b>`:""}</div>` : "");
  document.querySelectorAll("#swatches .sw").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.p === S.palette)));
  save();
}

/* ============ events ============ */
document.getElementById("swatches").innerHTML = PALETTES
  .map(([id,label,c]) => `<button class="sw" data-p="${id}" aria-pressed="${id==="evergreen"}"><i style="background:${c}"></i>${label}</button>`).join("");

document.addEventListener("click", e => {
  const el = t => e.target.closest(t);

  const sw = el(".sw"); if(sw){ S.palette = sw.dataset.p; render(); return; }
  const pal = el("[data-palette]"); if(pal && pal.tagName === "BUTTON"){ S.palette = pal.dataset.palette; render(); return; }
  const tool = el("[data-tool]");
  if(tool){
    const k = tool.dataset.tool;
    if(k==="simulate") simulate();
    else if(k==="offline"){ setOffline(!S.offline); }
    else if(k==="reset"){ clearInterval(syncTimer); S = seed(); toast("Prototype data reset"); render(); }
    return;
  }
  const g = el("[data-go]"); if(g){ go(g.dataset.go); return; }
  const f = el("[data-filter]"); if(f){ S.filter = f.dataset.filter; render(); return; }
  const open = el("[data-open]");
  if(open){ const id = open.dataset.open; if(id !== "demo"){ S.editing = +id; go("detail"); } return; }
  const ta = el("[data-toggleapp]");
  if(ta){ const i = +ta.dataset.toggleapp; S.apps[i].on = !S.apps[i].on; touch();
    toast(`${S.apps[i].name} ${S.apps[i].on ? "added to" : "removed from"} the allow-list`); render(); return; }
  const ty = el("[data-type]");
  if(ty){ const t = S.txns.find(x=>x.id===S.editing);
    if(S.screen==="detail" && t){ t.type = ty.dataset.type; } else { editorType = ty.dataset.type; }
    render(); return; }
  const lf = el("[data-logfilter]"); if(lf){ S.logFilter = lf.dataset.logfilter; S.logOpen = null; render(); return; }
  const lo = el("[data-logopen]");
  if(lo){ const id = +lo.dataset.logopen; S.logOpen = S.logOpen === id ? null : id; render(); return; }
  const fl = el("[data-fromlog]");
  if(fl){
    const e = S.log.find(x => x.id === +fl.dataset.fromlog);
    if(e){ S.editing = null; editorType = "expense"; prefillFromLog = e; go("add"); }
    return;
  }
  const act = el("[data-action]"); if(act){ handle(act.dataset.action, act); return; }
  if(el("[data-dismiss]") && e.target.classList.contains("scrim")){ S.dialog = null; render(); }
});

document.addEventListener("keydown", e => {
  if((e.key===" "||e.key==="Enter") && e.target.classList && e.target.classList.contains("sw-track")){
    e.preventDefault(); e.target.click();
  }
});

let editorType = "expense";

function handle(a, el){
  const t = S.txns.find(x => x.id === S.editing);
  if(a==="grant"){ S.dialog = "permission"; render(); }
  else if(a==="allowperm"){ S.dialog = null; toast("Notification access granted"); go("chooseapps"); }
  else if(a==="denyperm"){ S.dialog = null; toast("Without access, add transactions manually"); go("chooseapps"); }
  else if(a==="signin"){ S.offline = false; S.queued = 0; toast("Signed in"); go("home"); }
  else if(a==="offline-start"){ S.offline = true; toast("Working offline — nothing will sync yet"); go("home"); }
  else if(a==="offline"){ setOffline(!S.offline); }
  else if(a==="askdelete"){ S.dialog = "delete"; render(); }
  else if(a==="closedialog"){ S.dialog = null; render(); }
  else if(a==="confirmdelete"){
    const gone = S.txns.find(x=>x.id===S.editing);
    S.txns = S.txns.filter(x => x.id !== S.editing);
    S.dialog = null; S.editing = null; touch();
    toast(`Deleted “${gone ? gone.title : "transaction"}”`, "Undo");
    undoBuffer = gone; go("transactions");
  }
  else if(a==="snackaction"){
    if(pendingLogJump){ pendingLogJump = false; S.snack = null; go("debug"); return; }
    if(undoBuffer){ S.txns.unshift(undoBuffer); undoBuffer = null; S.snack = null; toast("Restored"); render(); }
  }
  else if(a==="save"){ saveEditor(el.dataset.id); }
  else if(a==="saveaccount"){
    const n = document.getElementById("a-name"), em = document.getElementById("a-email");
    if(n) S.user.name = n.value.trim() || S.user.name;
    if(em) S.user.email = em.value.trim() || S.user.email;
    touch(); toast("Account updated"); render();
  }
  else if(a==="signout"){ S = seed(); toast("Signed out"); render(); }
  else if(a==="clearlog"){ S.log = []; S.logOpen = null; toast("Notification log cleared"); render(); }
  else if(a==="keeplog"){ S.keepLog = !S.keepLog;
    if(!S.keepLog){ S.log = S.log.map(e => Object.assign({}, e, { raw:"[not retained]", amt:null, dir:null })); }
    toast(S.keepLog ? "Raw text kept on device" : "Raw text no longer retained"); render(); }
  else if(a==="simulate"){ simulate(); }
}

let undoBuffer = null;
let pendingLogJump = false;

function saveEditor(id){
  const val = i => { const n = document.getElementById(i); return n ? n.value.trim() : ""; };
  const title = val("f-title"), amount = parseFloat(val("f-amount"));
  const amtField = document.getElementById("f-amount");
  if(!title || !(amount > 0)){
    if(amtField) amtField.closest(".field").classList.add("err");
    toast("Add a description and an amount above zero");
    return;
  }
  const payload = { title, amount, cat: val("f-cat") || "Other", when: val("f-when") || "Today", app: val("f-src") || "Manual" };
  if(id){
    const t = S.txns.find(x => x.id === +id);
    Object.assign(t, payload); t.status = "confirmed";
    touch(); toast("Transaction saved");
  } else {
    S.txns.unshift(Object.assign({ id: Date.now(), type: editorType, status:"confirmed",
      note: prefillFromLog ? "From notification: “" + prefillFromLog.raw + "”" : "" }, payload));
    touch(); toast("Transaction added");
  }
  prefillFromLog = null;
  S.editing = null; editorType = "expense";
  go("transactions");
}

const TEMPLATES = [
  { title:"7-Eleven Bajada", amount:158, type:"expense", cat:"Food",
    raw:"PHP 158.00 paid to 7-ELEVEN BAJADA.", amt:"PHP 158.00", dir:"paid" },
  { title:"Cebu Pacific", amount:4270, type:"expense", cat:"Other",
    raw:"Payment of PHP 4,270.00 to CEBU PACIFIC AIR.", amt:"PHP 4,270.00", dir:"Payment" },
  { title:"Refund — Lazada", amount:899, type:"income", cat:"Income",
    raw:"You received PHP 899.00 refund from LAZADA.", amt:"PHP 899.00", dir:"received" },
  { title:"Globe postpaid", amount:1599, type:"expense", cat:"Bills",
    raw:"PHP 1,599.00 paid to GLOBE TELECOM.", amt:"PHP 1,599.00", dir:"paid" },
  { title:"Foodpanda", amount:412, type:"expense", cat:"Food",
    raw:"PHP 412.00 paid to FOODPANDA PH.", amt:"PHP 412.00", dir:"paid" }
];
let prefillFromLog = null;

const UNPARSEABLE = [
  "Your balance is PHP 9,120.40 as of 6:00 PM.",
  "Reminder: verify your account before Dec 31 to keep sending money.",
  "Maintenance advisory: services will be unavailable 1:00–3:00 AM."
];

function logPush(entry){
  S.log.unshift(entry);
  if(!S.keepLog){ entry.raw = "[not retained]"; entry.amt = null; entry.dir = null; }
  if(S.log.length > 40) S.log.pop();
}

function simulate(){
  const on = S.apps.filter(a => a.on);
  if(!on.length){ toast("No apps are on the allow-list yet"); return; }
  const app = on[Math.floor(Math.random()*on.length)];
  app.count++;
  touch();

  // roughly one in four captures is something the parser can't use
  if(Math.random() < 0.25){
    logPush({ id: Date.now(), app: app.name, when: "Today · just now", result: "unrecognized",
      raw: UNPARSEABLE[Math.floor(Math.random()*UNPARSEABLE.length)],
      amt:null, dir:null, type:null, merchant:null,
      why:"No transaction verb alongside the amount, so nothing was created. Check the log if you expected one." });
    if(S.screen !== "debug") toast(`${app.name} notification couldn't be read`, "View log");
    else toast(`${app.name} notification couldn't be read`);
    pendingLogJump = true;
    render();
    return;
  }

  const tpl = TEMPLATES[Math.floor(Math.random()*TEMPLATES.length)];
  S.txns.unshift({ id: Date.now(), title: tpl.title, app: app.name, amount: tpl.amount, type: tpl.type,
    status: "review", cat: tpl.cat, when: "Today · just now", note: "Auto-parsed: “" + tpl.raw + "”" });
  logPush({ id: Date.now()+1, app: app.name, when: "Today · just now", result: "review",
    raw: tpl.raw, amt: tpl.amt, dir: tpl.dir, type: tpl.type, merchant: tpl.title.toUpperCase(),
    why:"Amount and direction matched. Held for review until you confirm it." });

  if(["welcome","how","permission","chooseapps","auth-login","auth-signup"].includes(S.screen)) S.screen = "transactions";
  toast(`Parsed from ${app.name} — needs review`);
  render();
}

load();
render();
</script>
